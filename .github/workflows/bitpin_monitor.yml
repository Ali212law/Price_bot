name: Bitpin Monitor (M5 Data)

on:
  schedule:
    - cron: '5,20,35,50 * * * *' # هر ۱۵ دقیقه با ۵ دقیقه تاخیر نسبت به Paper35
  workflow_dispatch:

concurrency:
  group: bitpin-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Run Bitpin Monitor
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python bitpin_monitor.py
