name: Fetch Deep 4H Data

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Run Data Fetcher
        run: python fetch_deep_data.py
      - name: Commit deep data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deep_history_4h.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update Deep 4H History"
          git push || true
