name: Fetch Polymarket Data

on:
  workflow_dispatch:

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests
          
      - name: Run data adapter
        working-directory: alt_markets_lab/prediction_market
        run: python data_adapter.py
      
      - name: Upload data as artifact
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-data
          path: alt_markets_lab/prediction_market/data/
      
      - name: Run backtest
        working-directory: alt_markets_lab/prediction_market
        run: python test_m9_modified.py
