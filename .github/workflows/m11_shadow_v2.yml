name: M11 V2 Shadow Observer
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pandas numpy requests
      - name: Run V2
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python m11_shadow_v2.py
