name: Multi-Asset Monitor (M6 Data)

on:
  schedule:
    - cron: '10,25,40,55 * * * *' # هر ۱۵ دقیقه، با تاخیر نسبت به ربات‌های دیگر
  workflow_dispatch:

concurrency:
  group: multi-asset-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Run Multi-Asset Monitor
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python multi_asset_monitor.py
