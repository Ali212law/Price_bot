name: Paper Trade 33

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install requests websockets pyrobale
      - name: Run paper_trade33
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TRADING_ENABLED: "False"
          ABAN_API_KEY: ${{ secrets.ABAN_API_KEY }}
        run: python paper_trade33.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "Update data (paper_trade33)"
          git push || true
