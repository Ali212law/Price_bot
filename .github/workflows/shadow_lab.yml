name: Shadow Lab

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  shadow-lab:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests

      - name: Quarantine patch H6 (runtime, workspace-only)
        run: python ci_patch_quarantine.py

      - name: Run shadow_lab
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python shadow_lab.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main || echo "::warning::pull failed"
          git add -A -- . ':(exclude)shadow_lab.py' ':(exclude)persist_fail.marker' ':(exclude)quarantine_patch_fail.marker'
          if git diff --staged --quiet; then
            echo "No local changes to commit"
          else
            git commit -m "Update data (shadow_lab)"
          fi
          for i in 1 2 3; do
            if git push origin main; then echo "PUSH OK (attempt $i)"; break; fi
            echo "PUSH attempt $i failed"; sleep 5
            git pull --rebase --autostash origin main || true
            if [ $i -eq 3 ]; then echo "::error::git push failed after 3 attempts"; fi
          done

      - name: Quarantine gate (H6)
        if: always()
        run: |
          if [ -f quarantine_patch_fail.marker ]; then
            echo "::error::H6 quarantine patch MISSED — D-2026-10-18-02 violated silently"
            cat quarantine_patch_fail.marker
            exit 1
          fi
          echo "H6 quarantine OK"
