name: Shadow Lab

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  shadow-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Run shadow_lab
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python shadow_lab.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add shadow_lab_trades.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update shadow_lab_trades"
          git push || true
