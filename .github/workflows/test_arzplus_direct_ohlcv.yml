name: Test Arzplus Direct OHLCV

on:
  workflow_dispatch:

jobs:
  test-arzplus-direct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests
      - name: Run Direct OHLCV Test
        run: python iran_market_lab/test_arzplus_direct_ohlcv.py
