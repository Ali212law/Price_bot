name: Test New Exchanges (Rastin & Ramzinex)

on:
  workflow_dispatch:

jobs:
  test-apis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests
      - name: Run API Tests
        run: python iran_market_lab/test_new_exchanges.py
