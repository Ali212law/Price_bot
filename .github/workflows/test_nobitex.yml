name: Test Nobitex API
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Run test
        env:
          NOBITEX_API_KEY: ${{ secrets.NOBITEX_API_KEY }}
        run: python test_nobitex.py
