name: Test Ramzinex OHLCV

on:
  workflow_dispatch:

jobs:
  test-ohlcv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests
      - name: Run OHLCV Test
        run: python iran_market_lab/test_ramzinex_ohlcv.py
