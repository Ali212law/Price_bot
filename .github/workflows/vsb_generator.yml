name: VSB Signal Generator

on:
  schedule:
    - cron: '35 */4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  run-vsb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests urllib3
      - name: Run VSB Generator
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python vsb_generator.py
