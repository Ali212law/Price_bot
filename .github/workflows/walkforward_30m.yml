name: Walk-Forward 30m Test

on:
  workflow_dispatch: # اجرای دستی

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Run Walk-Forward 30m
        run: python walkforward_30m.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add walkforward_30m_results.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update 30m Walk-Forward results"
          git push || true
