name: Walk-Forward Top 10 Assets

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Run Top 10 Walk-Forward
        run: python walkforward_top10.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add walkforward_top10_results.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update Top10 Walk-Forward results"
          git push || true
