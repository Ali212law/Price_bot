name: Test Aban
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Test
        env:
          ABAN_API_KEY: ${{ secrets.ABAN_API_KEY }}
        run: python test_aban.py
